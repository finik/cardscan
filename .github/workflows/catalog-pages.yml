# Build the static deck catalog from in-repo fixtures and publish to GitHub Pages.
# Does not require the private photo archive — only server/fixtures/.
#
# Enable once: Settings → Pages → Build and deployment → Source: GitHub Actions.

name: Catalog Pages

on:
  push:
    branches: [main]
    paths:
      - "server/generate_catalog.py"
      - "server/fixtures/**"
      - ".github/workflows/catalog-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate catalog from fixtures
        run: python3 server/generate_catalog.py server/fixtures -o _site --title "Card Scan Catalog"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
